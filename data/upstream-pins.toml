# Upstream pins. Every file under data/concordance/ is vendored at exactly this commit so a
# build is reproducible with no network access, and the commit SHA is stamped into every
# published row as `concordance_version`. Re-vendoring is a deliberate, reviewed change:
# bump the SHA, replace the files, re-run the coverage matrix, and record what moved.

[concordance]
name       = "IRS E-file Master Concordance File"
author     = "Nonprofit Open Data Collective"
repo       = "https://github.com/Nonprofit-Open-Data-Collective/irs-efile-master-concordance-file"
commit     = "d8266da934cd1cb5d1d9cedc5398ba107b0c7bbe"
commit_date = "2026-08-23"
branch     = "master"
license    = "ODC-By-1.0"
license_file = "data/concordance/LICENSE.md"
# Which vendored file carries which form. The main file has no 990-PF rows at all; 990-PF
# lives in its own file under 02-concordance-foundations/, and the Part XV slice is the
# grant-edge subset of it. Discovering that cost a morning; hence the note.
files.main       = "concordance.csv"              # F990 core + every schedule incl. Schedule I
files.pf_full    = "F990-PF-FULL.CSV"             # all of Form 990-PF
files.pf_part15  = "f990pf-part-15-v3.csv"        # 990-PF Part XV only (grants paid / approved)
files.pf_aux     = "f990pf-aux-schedule-v2.csv"   # 990-PF PART-99 aux; carries no version data

[concordance.sha256]
"concordance.csv" = "d3cdcd216acd84509a140782c8e340b9a941d499d7325fdd9f0c98b6e3278e3f"
"F990-PF-FULL.CSV" = "d97f0131476db14d57b19febb8bd27e6ce7458b360177c132fa50b47ddcfd95a"
"f990pf-aux-schedule-v2.csv" = "6c963b7aed5f197c2af02b5903142e8113b502abaeef92e037ef46ccfd14b402"
"f990pf-part-15-v3.csv" = "b9c1d56bcd1921c5b8e558c99a0f4e58136510609b1ba379b7ce969e2e8d2f1a"
"LICENSE.md" = "11a6d83734845ad09d809667aa219857a5b985b28c258a2eebf5677668a6bd3b"

# Known upstream state at this pin, so nobody re-derives it:
#  - versions annotations for the Part XV and Schedule I subtrees stop at 2016v3.0 / 2018v3.x,
#    while the xpaths themselves (current_version = T) match 2019-2022 filings exactly.
#    Verified against real filings at returnVersion 2020v4.0, 2021v4.2, 2022v5.0.
#  - 03-versions/raw-mappings/ holds per-version dumps through 2022v5.0, which is the raw
#    material for extending those annotations. That is the upstream contribution we owe.

[concordance.raw_mappings]
# Per-schema-version XPath inventories from 03-versions/raw-mappings/, one file per
# returnVersion, columns Version,Source,Xpath,Type,Description,Line,MinOccur,MaxOccur.
# These are the coverage-matrix input: for each version in the corpus, every xpath the
# schema actually contains. Upstream produced them; the concordance's `versions` column
# was never regenerated from them past 2016. Diffing our resolved map against these is
# the drift report, and the join is the PR we owe upstream.
directory = "data/concordance/raw-mappings"

